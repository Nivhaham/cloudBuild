substitutions:
  _TAG: 'latest'

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/practice-repo/app:$_TAG'
      - '.'
    id: 'build-image'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/practice-repo/app:$_TAG'
    id: 'push-image'
    waitFor: ['build-image']

  - name: 'hashicorp/terraform:1.9'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        cd day4-cloudrun
        terraform init
        terraform apply -auto-approve -var="project_id=$PROJECT_ID" -var="image_tag=$_TAG"
    id: 'deploy'
    waitFor: ['push-image']

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/practice-repo/app:$_TAG'

options:
  logging: CLOUD_LOGGING_ONLY
